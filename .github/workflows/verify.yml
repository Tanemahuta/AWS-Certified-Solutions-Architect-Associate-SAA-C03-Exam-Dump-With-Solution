name: verify

on:
  push:
    branches-ignore: [main, gh-pages]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.repository_id }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify-callable.yml
    permissions:
      contents: read
      actions: read

  quality:
    uses: ./.github/workflows/quality-callable.yml
    permissions:
      contents: read

  codeql:
    uses: ./.github/workflows/codeql-callable.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  ci-passed:
    name: CI passed
    needs: [verify, quality, codeql]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification workflow to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          for result in "${VERIFY_RESULT}" "${QUALITY_RESULT}" "${CODEQL_RESULT}"; do
            if [[ "${result}" != success ]]; then
              echo "Verification did not succeed: ${result}" >&2
              exit 1
            fi
          done
