name: dependency quality

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  gate:
    uses: ./.github/workflows/pr-gate-callable.yml
    permissions:
      pull-requests: read

  quality:
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/quality-callable.yml
    permissions:
      contents: read
