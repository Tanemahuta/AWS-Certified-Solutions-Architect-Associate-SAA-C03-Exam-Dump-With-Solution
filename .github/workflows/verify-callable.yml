name: verify

on:
  workflow_call: {}

concurrency:
  group: verify-${{ github.repository_id }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    working-directory: study-app

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-study-app
      - run: pnpm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-study-app
      - run: pnpm run typecheck

  test:
    name: Jest tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-study-app
      - run: pnpm run test:coverage
      - run: pnpm run test:deployment
      - run: pnpm run test:security

  build:
    uses: ./.github/workflows/build-callable.yml
    permissions:
      contents: read
      actions: read
