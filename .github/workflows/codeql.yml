name: CodeQL

on:
  push:
    branches-ignore: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  gate:
    uses: ./.github/workflows/pr-gate-callable.yml
    permissions:
      pull-requests: read

  codeql:
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/codeql-callable.yml
    permissions:
      actions: read
      contents: read
      security-events: write
