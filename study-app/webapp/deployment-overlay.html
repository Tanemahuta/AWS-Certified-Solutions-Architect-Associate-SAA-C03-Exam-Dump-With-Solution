<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Version selector preview</title>
  <style>
    body { margin: 0; background: #f1f5f9; color: #172033; font-family: system-ui, sans-serif; }
    main { max-width: 60rem; margin: 2rem auto; padding: 2rem; border-radius: 1rem; background: white; }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Version selector preview</h1>
    <p>Use the Git button at the bottom right to open the branch selector.</p>
    <p>Open this file directly to preview the shared HTML, styles, and behavior used by the app and the root placeholder.</p>
  </main>
<!-- deployment-overlay:start -->
<style>
.deployment-toolbar { position: fixed; bottom: 1rem; right: 1rem; z-index: 1000; display: flex; align-items: center; gap: .5rem; max-width: calc(100vw - 2rem); padding: .35rem .5rem; border: 1px solid #cbd5e1; border-radius: .8rem; background: #f8fafc; box-shadow: 0 6px 24px rgb(23 32 51 / 12%); color: #172033; font: .875rem/1.4 system-ui, sans-serif; }
.deployment-toolbar .deployment-version { max-width: min(55vw, 20rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.deployment-toolbar select { min-width: 8rem; max-width: min(55vw, 22rem); min-height: 44px; padding: .55rem .7rem; border: 1px solid #94a3b8; border-radius: .65rem; background: white; color: inherit; font: inherit; }
.deployment-toolbar select:focus-visible { outline: 2px solid #4f46e5; outline-offset: 2px; }
.deployment-menu { position: absolute; bottom: calc(100% + .5rem); right: 0; width: max-content; max-width: calc(100vw - 2rem); padding: 1rem; border: 1px solid #cbd5e1; border-radius: .8rem; background: #f8fafc; box-shadow: 0 6px 24px rgb(23 32 51 / 12%); }
.deployment-menu label { display: block; margin-bottom: .5rem; }
.deployment-toggle { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: .6rem; border: 1px solid #c7d2fe; border-radius: .65rem; background: #e0e7ff; color: #312e81; cursor: pointer; }
.deployment-toggle:hover { background: #c7d2fe; }
.deployment-toggle svg { width: 24px; height: 24px; fill: currentColor; }
.deployment-toolbar :focus-visible { outline: 2px solid #4f46e5; outline-offset: 2px; }
</style>
<aside class="deployment-toolbar" aria-label="App version and branch" data-version="1.2.3" data-branch="main">
  <span class="deployment-version">v1.2.3</span>
  <button type="button" class="deployment-toggle" aria-label="Select branch" title="Select branch" aria-expanded="false" aria-controls="deployment-menu">
    <svg class="mdi mdi-git" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.62 11.11L12.89 2.38C12.38 1.87 11.55 1.87 11.04 2.38L9.23 4.19L11.53 6.5C12.07 6.32 12.7 6.44 13.13 6.87C13.56 7.3 13.68 7.93 13.5 8.47L15.72 10.69C16.26 10.5 16.89 10.63 17.32 11.06C17.92 11.66 17.92 12.64 17.32 13.24C16.71 13.85 15.73 13.85 15.13 13.24C14.68 12.79 14.57 12.13 14.8 11.57L12.73 9.5V14.94C12.88 15.01 13.03 15.11 13.15 15.23C13.75 15.83 13.75 16.81 13.15 17.41C12.55 18.01 11.57 18.01 10.97 17.41C10.37 16.81 10.37 15.83 10.97 15.23C11.12 15.08 11.29 14.97 11.47 14.9V9.41C11.29 9.34 11.12 9.23 10.97 9.08C10.5 8.61 10.39 7.92 10.63 7.34L8.36 5.06L2.38 11.04C1.87 11.55 1.87 12.38 2.38 12.89L11.11 21.62C11.62 22.13 12.45 22.13 12.96 21.62L21.62 12.96C22.13 12.45 22.13 11.62 21.62 11.11Z" /></svg>
  </button>
  <div id="deployment-menu" class="deployment-menu" hidden>
  <label for="deployment-branch">Branch</label>
  <select id="deployment-branch">
    <!-- overlay-options:start -->
    <option value="main" data-path="" selected>main</option>
    <option value="feature/preview" data-path="feature/preview/">feature/preview</option>
    <!-- overlay-options:end -->
  </select>
  </div>
</aside>
<script>
(() => {
  const toolbar = document.querySelector('.deployment-toolbar');
  const selector = document.getElementById('deployment-branch');
  const toggle = toolbar.querySelector('.deployment-toggle');
  const menu = document.getElementById('deployment-menu');
  const closeMenu = () => {
    menu.hidden = true;
    toggle.setAttribute('aria-expanded', 'false');
  };
  toggle.addEventListener('click', () => {
    menu.hidden = !menu.hidden;
    toggle.setAttribute('aria-expanded', String(!menu.hidden));
    if (!menu.hidden) selector.focus();
  });
  document.addEventListener('click', event => {
    if (!toolbar.contains(event.target)) closeMenu();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !menu.hidden) {
      closeMenu();
      toggle.focus();
    }
  });
  document.addEventListener('focusin', event => {
    if (!toolbar.contains(event.target)) closeMenu();
  });
  const version = toolbar.dataset.version;
  const branch = toolbar.dataset.branch;
  const versionLabel = toolbar.querySelector('.deployment-version');
  versionLabel.textContent = version === 'unpublished' ? 'Unpublished' : version === 'dev' ? 'dev' : 'v' + version;
  versionLabel.title = versionLabel.textContent;
  const siteRoot = document.querySelector('meta[name="study-app-site-root"]')?.content;

  selector.addEventListener('change', () => {
    const selected = selector.selectedOptions[0];
    if (siteRoot && selected && !selected.disabled) {
      window.location.assign(new URL(selected.dataset.path + 'index.html', siteRoot).href);
    }
  });

  if (!siteRoot || !['http:', 'https:'].includes(window.location.protocol)) return;
  fetch(new URL('branches.json', siteRoot), { cache: 'no-store' })
    .then(response => {
      if (!response.ok) throw new Error('Branch list unavailable');
      return response.json();
    })
    .then(manifest => {
      const options = manifest.branches.map(item => {
        const option = document.createElement('option');
        option.value = item.name;
        option.dataset.path = item.path;
        option.disabled = !item.published;
        option.textContent = item.name + (item.published ? '' : ' (build pending)');
        return option;
      });
      if (!manifest.branches.some(item => item.name === branch)) {
        const deleted = document.createElement('option');
        deleted.value = branch;
        deleted.textContent = branch + ' (deleted)';
        deleted.disabled = true;
        options.unshift(deleted);
      }
      selector.replaceChildren(...options);
      selector.value = branch;
    })
    .catch(() => { /* Keep the embedded options when offline or downloading the app. */ });
})();
</script>
<!-- deployment-overlay:end -->
</body>
</html>
